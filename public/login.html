<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FIT — Login</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FIT">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    .login-page {
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      padding-top: max(24px, env(safe-area-inset-top));
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }

    .login-container {
      width: 100%;
      max-width: 360px;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-mark {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      border-radius: 16px;
      background: var(--orange-dim);
      border: 1.5px solid rgba(255,107,53,.3);
      margin-bottom: 16px;
      color: var(--orange);
    }

    .login-logo h1 {
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: 0.18em;
      color: var(--text);
      line-height: 1;
    }

    .login-logo h1 span { color: var(--orange); }

    .login-tagline {
      font-size: .72rem;
      color: var(--text-3);
      letter-spacing: .16em;
      text-transform: uppercase;
      margin-top: 8px;
      font-weight: 600;
    }

    .login-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 2px solid var(--orange);
      border-radius: var(--radius);
      padding: 28px 22px;
    }

    .login-card-title {
      font-size: .8rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 18px;
    }

    .login-card .form-group { margin-bottom: 16px; }
    .login-card .form-group:last-of-type { margin-bottom: 22px; }

    .login-error {
      color: var(--red);
      font-size: .82rem;
      font-weight: 600;
      text-align: center;
      margin-top: 12px;
      padding: 10px;
      background: var(--red-dim);
      border-radius: var(--radius-sm);
      border: 1px solid rgba(255,69,58,.2);
    }

    .login-toggle {
      text-align: center;
      margin-top: 18px;
      font-size: .82rem;
      color: var(--text-3);
    }

    .login-toggle a {
      color: var(--orange);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }

    .login-toggle a:hover { text-decoration: underline; }

    /* Prevent iOS auto-zoom on input focus (requires font-size ≥ 16px) */
    input, select, textarea { font-size: 16px !important; }
  </style>
</head>
<body class="login-page">
  <div class="login-container">

    <div class="login-logo">
      <div class="login-mark">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 4v16M18 4v16M3 8h3M3 16h3M21 8h-3M21 16h-3M9 12h6"/>
        </svg>
      </div>
      <h1>FIT</h1>
      <p class="login-tagline">Seu progresso. Seus resultados.</p>
    </div>

    <!-- Login form -->
    <div class="login-card" id="loginCard">
      <div class="login-card-title">Entrar</div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="name">Usuário</label>
          <input type="text" id="name" name="name" placeholder="Usuário" required autocomplete="username" spellcheck="false" autocapitalize="none">
        </div>

        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Entrar</button>

        <p class="login-error" id="loginError" style="display:none"></p>
      </form>
    </div>

    <p class="login-toggle" id="loginToggle">
      Não tem conta? <a onclick="showRegister()">Criar conta</a>
    </p>

    <!-- Register form (hidden by default) -->
    <div class="login-card" id="registerCard" style="display:none">
      <div class="login-card-title">Criar conta</div>
      <form id="registerForm" novalidate>
        <div class="form-group">
          <label for="regName">Usuário</label>
          <input type="text" id="regName" name="name" placeholder="Mínimo 3 caracteres" required autocomplete="username" spellcheck="false" autocapitalize="none">
        </div>

        <div class="form-group">
          <label for="regEmail">E-mail <span style="color:var(--text-3);font-weight:400">(opcional)</span></label>
          <input type="email" id="regEmail" name="email" placeholder="seu@email.com" autocomplete="email">
        </div>

        <div class="form-group">
          <label for="regPassword">Senha</label>
          <input type="password" id="regPassword" name="password" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
        </div>

        <div class="form-group">
          <label for="regPasswordConfirm">Confirmar senha</label>
          <input type="password" id="regPasswordConfirm" name="password_confirm" placeholder="••••••••" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="registerBtn">Criar conta</button>

        <p class="login-error" id="registerError" style="display:none"></p>
      </form>
    </div>

    <p class="login-toggle" id="registerToggle" style="display:none">
      Já tem conta? <a onclick="showLogin()">Entrar</a>
    </p>

  </div>

  <script>
    fetch('/api/auth/me').then(async r => {
      if (!r.ok) return;
      const d = await r.json();
      const role = d.user?.role;
      location.href = (role === 'admin' || role === 'super_admin') ? '/admin' : '/app';
    }).catch(() => {});

    function showRegister() {
      document.getElementById('loginCard').style.display    = 'none';
      document.getElementById('loginToggle').style.display  = 'none';
      document.getElementById('registerCard').style.display  = '';
      document.getElementById('registerToggle').style.display = '';
      document.getElementById('regName').focus();
    }

    function showLogin() {
      document.getElementById('registerCard').style.display   = 'none';
      document.getElementById('registerToggle').style.display = 'none';
      document.getElementById('loginCard').style.display      = '';
      document.getElementById('loginToggle').style.display    = '';
      document.getElementById('name').focus();
    }

    document.getElementById('loginForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn   = document.getElementById('loginBtn');
      const errEl = document.getElementById('loginError');
      errEl.style.display = 'none';
      btn.textContent = '...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name:     document.getElementById('name').value.trim(),
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Usuário ou senha inválidos');
        const role = data.user?.role;
        location.href = (role === 'admin' || role === 'super_admin') ? '/admin' : '/app';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.textContent = 'Entrar';
        btn.disabled = false;
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async e => {
      e.preventDefault();
      const btn   = document.getElementById('registerBtn');
      const errEl = document.getElementById('registerError');
      errEl.style.display = 'none';

      const name     = document.getElementById('regName').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm  = document.getElementById('regPasswordConfirm').value;

      if (password !== confirm) {
        errEl.textContent = 'As senhas não conferem';
        errEl.style.display = 'block';
        return;
      }

      btn.textContent = '...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, password, email: document.getElementById('regEmail').value.trim() || undefined })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Erro ao criar conta');
        location.href = '/app'; // register always creates role='user'
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = 'block';
        btn.textContent = 'Criar conta';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FitX</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0D0D0D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitX">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: #0D0D0D;
      color: #F2F2F0;
      font-family: 'Manrope', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .lp {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      padding-top: max(32px, env(safe-area-inset-top, 0px));
      padding-bottom: max(32px, env(safe-area-inset-bottom, 0px));
    }

    .lp-wrap { width: 100%; max-width: 380px; }

    /* ── Logo — same mark as app header ── */
    .lp-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      margin-bottom: 10px;
    }
    .lp-logo-mark {
      width: 42px; height: 42px;
      background: #C4E538;
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .lp-logo-name {
      font-size: 26px;
      font-weight: 800;
      color: #F2F2F0;
      letter-spacing: -0.3px;
      line-height: 1;
    }
    .lp-tagline {
      text-align: center;
      color: #8A8A8E;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 32px;
    }

    /* ── Field ── */
    .lp-field { margin-bottom: 16px; }
    .lp-label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      color: #8A8A8E;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }
    .lp-input {
      width: 100%;
      background: #1A1A1C;
      border: 1.5px solid transparent;
      border-radius: 12px;
      padding: 13px 15px;
      /* 16px prevents iOS auto-zoom */
      font-size: 16px;
      font-weight: 500;
      color: #F2F2F0;
      font-family: inherit;
      outline: none;
      transition: border-color .15s;
      -webkit-appearance: none;
      /* visually scale down while keeping 16px for iOS */
      transform-origin: left center;
    }
    .lp-input::placeholder { color: #44444A; }
    .lp-input:focus { border-color: #C4E538; }

    /* ── Forgot ── */
    .lp-forgot {
      text-align: right;
      margin-top: 8px;
      margin-bottom: 24px;
    }
    .lp-forgot a {
      color: #C4E538;
      font-size: 13px;
      font-weight: 600;
      text-decoration: underline;
      cursor: pointer;
    }

    /* ── Primary button ── */
    .lp-btn {
      width: 100%;
      background: #C4E538;
      color: #0D0D0D;
      border: none;
      border-radius: 13px;
      padding: 15px;
      font-size: 15px;
      font-weight: 800;
      font-family: inherit;
      cursor: pointer;
      text-decoration: underline;
      letter-spacing: 0.01em;
      transition: opacity .15s;
    }
    .lp-btn:active { opacity: 0.85; }
    .lp-btn:disabled { opacity: 0.45; cursor: not-allowed; text-decoration: none; }

    /* ── Divider ── */
    .lp-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0;
    }
    .lp-divider-line { flex: 1; height: 1px; background: #26262A; }
    .lp-divider-text {
      font-size: 12px;
      color: #5A5A60;
      font-weight: 500;
      white-space: nowrap;
    }

    /* ── Social buttons ── */
    .lp-social-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 26px;
    }
    .lp-social-btn {
      background: #1A1A1C;
      border: 1.5px solid #26262A;
      border-radius: 12px;
      padding: 13px 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 700;
      color: #F2F2F0;
      font-family: inherit;
      cursor: pointer;
      transition: opacity .15s;
    }
    .lp-social-btn:active { opacity: 0.7; }

    /* ── Footer ── */
    .lp-footer {
      text-align: center;
      font-size: 13px;
      color: #6A6A6E;
      font-weight: 500;
    }
    .lp-footer a {
      color: #C4E538;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    /* ── Error ── */
    .lp-error {
      color: #ff7070;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      margin-top: 12px;
      padding: 10px 14px;
      background: rgba(255,80,80,0.10);
      border-radius: 10px;
      border: 1px solid rgba(255,80,80,0.18);
    }

    /* ── Panels ── */
    .lp-panel { display: none; }
    .lp-panel.active { display: block; }

    /* ── Toast ── */
    #lp-toast {
      position: fixed;
      bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(10px);
      background: #2A2A2C;
      color: #F2F2F0;
      font-size: 13px;
      font-weight: 600;
      padding: 11px 18px;
      border-radius: 99px;
      border: 1px solid #36363A;
      opacity: 0;
      transition: opacity .2s, transform .2s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 999;
      font-family: 'Manrope', system-ui, sans-serif;
    }
    #lp-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
<div class="lp">
  <div class="lp-wrap">

    <!-- Logo — same barbell mark as app header -->
    <div class="lp-logo">
      <div class="lp-logo-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0D0D0D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 4v16M18 4v16M3 8h3M3 16h3M21 8h-3M21 16h-3M9 12h6"/>
        </svg>
      </div>
      <span class="lp-logo-name">FitX</span>
    </div>
    <p class="lp-tagline">Entre para continuar sua jornada.</p>

    <!-- ── Login panel ── -->
    <div class="lp-panel active" id="panelLogin">
      <div class="lp-field">
        <label class="lp-label" for="loginName">USUÁRIO</label>
        <input class="lp-input" type="text" id="loginName" placeholder="seu usuário"
               autocomplete="username" spellcheck="false" autocapitalize="none">
      </div>
      <div class="lp-field" style="margin-bottom:0">
        <label class="lp-label" for="loginPassword">SENHA</label>
        <input class="lp-input" type="password" id="loginPassword" placeholder="••••••••"
               autocomplete="current-password">
      </div>
      <div class="lp-forgot">
        <a onclick="lpToast('Em breve 🔒')">Esqueci minha senha</a>
      </div>
      <button class="lp-btn" id="loginBtn" onclick="doLogin()">Entrar</button>
      <div class="lp-error" id="loginError" style="display:none"></div>

      <div class="lp-divider">
        <div class="lp-divider-line"></div>
        <span class="lp-divider-text">ou continue com</span>
        <div class="lp-divider-line"></div>
      </div>

      <div class="lp-social-row">
        <button class="lp-social-btn" onclick="lpToast('Em breve')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="20" height="16" x="2" y="4" rx="2"/>
            <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
          </svg>
          Apple
        </button>
        <button class="lp-social-btn" onclick="lpToast('Em breve')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
            <path d="M2 12h20"/>
          </svg>
          Google
        </button>
      </div>

      <p class="lp-footer">Não tem conta? <a onclick="showRegister()">Cadastre-se</a></p>
    </div>

    <!-- ── Register panel ── -->
    <div class="lp-panel" id="panelRegister">
      <!-- Honeypot fields: hidden from real users, bots fill them -->
      <div style="display:none" aria-hidden="true">
        <input type="text"  id="hp_website"      name="website"      tabindex="-1" autocomplete="off">
        <input type="text"  id="hp_phone_number" name="phone_number"  tabindex="-1" autocomplete="off">
      </div>
      <div class="lp-field">
        <label class="lp-label" for="regName">USUÁRIO</label>
        <input class="lp-input" type="text" id="regName" placeholder="Mínimo 3 caracteres"
               autocomplete="username" spellcheck="false" autocapitalize="none">
      </div>
      <div class="lp-field">
        <label class="lp-label" for="regEmail">E-MAIL <span style="color:#5A5A60;font-weight:500;text-transform:none;letter-spacing:0;font-size:11px">(opcional)</span></label>
        <input class="lp-input" type="email" id="regEmail" placeholder="seu@email.com"
               autocomplete="email">
      </div>
      <div class="lp-field">
        <label class="lp-label" for="regPassword">SENHA</label>
        <input class="lp-input" type="password" id="regPassword" placeholder="Mínimo 6 caracteres"
               autocomplete="new-password">
      </div>
      <div class="lp-field" style="margin-bottom:24px">
        <label class="lp-label" for="regConfirm">CONFIRMAR SENHA</label>
        <input class="lp-input" type="password" id="regConfirm" placeholder="••••••••"
               autocomplete="new-password">
      </div>
      <button class="lp-btn" id="registerBtn" onclick="doRegister()">Criar conta</button>
      <div class="lp-error" id="registerError" style="display:none"></div>
      <p class="lp-footer" style="margin-top:22px">Já tem conta? <a onclick="showLogin()">Entrar</a></p>
    </div>

  </div>
</div>

<div id="lp-toast"></div>

<script>
  fetch('/api/auth/me').then(async r => {
    if (!r.ok) return;
    const d = await r.json();
    const role = d.user?.role;
    location.href = (role === 'admin' || role === 'super_admin') ? '/admin' : '/app';
  }).catch(() => {});

  function showRegister() {
    document.getElementById('panelLogin').classList.remove('active');
    document.getElementById('panelRegister').classList.add('active');
    document.getElementById('regName').focus();
  }
  function showLogin() {
    document.getElementById('panelRegister').classList.remove('active');
    document.getElementById('panelLogin').classList.add('active');
    document.getElementById('loginName').focus();
  }

  async function doLogin() {
    const btn   = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    btn.textContent = '...';
    btn.disabled = true;
    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name:     document.getElementById('loginName').value.trim(),
          password: document.getElementById('loginPassword').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Usuário ou senha inválidos');
      const role = data.user?.role;
      location.href = (role === 'admin' || role === 'super_admin') ? '/admin' : '/app';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.textContent = 'Entrar';
      btn.disabled = false;
    }
  }

  async function doRegister() {
    const btn     = document.getElementById('registerBtn');
    const errEl   = document.getElementById('registerError');
    const pass    = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;
    errEl.style.display = 'none';
    if (pass !== confirm) {
      errEl.textContent = 'As senhas não conferem';
      errEl.style.display = 'block';
      return;
    }
    btn.textContent = '...';
    btn.disabled = true;
    try {
      const res  = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name:         document.getElementById('regName').value.trim(),
          password:     pass,
          email:        document.getElementById('regEmail').value.trim() || undefined,
          website:      document.getElementById('hp_website').value,
          phone_number: document.getElementById('hp_phone_number').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Erro ao criar conta');
      location.href = '/app';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.style.display = 'block';
      btn.textContent = 'Criar conta';
      btn.disabled = false;
    }
  }

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    if (document.getElementById('panelLogin').classList.contains('active')) doLogin();
    else doRegister();
  });

  let _t;
  function lpToast(msg) {
    const el = document.getElementById('lp-toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_t);
    _t = setTimeout(() => el.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
